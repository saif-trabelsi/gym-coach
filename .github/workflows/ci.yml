name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          cd backend
          python -m pytest -v

  frontend-tests-and-build:
    name: Frontend Vitest Suite & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest test suite
        run: |
          cd frontend
          npx vitest run src/recording/ src/ui/ src/analytics/ src/pose/ src/feedback/ src/reports/ src/design/ src/api/ src/eval/ src/replay/ src/engine/squatRegression.test.ts src/engine/engine.test.ts

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  secret-leak-check:
    name: Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for API key patterns
        run: |
          # Ensure no live API keys are committed to repository
          MATCHES=$(git grep -n -E "AIza[0-9A-Za-z-_]{35}|AQ\.[A-Za-z0-9_-]{20,}" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Potential secret leak detected:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Secret scan passed: zero API keys detected."
