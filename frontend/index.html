<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Gym Coach — Real-Time Form Coaching</title>
    <meta
      name="description"
      content="AI Gym Coach: real-time squat and bicep curl coaching directly in your browser with private edge pose estimation and biomechanical form feedback."
    />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI Gym Coach" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="AI Gym Coach — Real-Time Form Coaching" />
    <meta
      property="og:description"
      content="Real-time squat and bicep curl coaching in the browser with private edge pose estimation. No video leaves your device."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Gym Coach — Real-Time Form Coaching" />
    <meta
      name="twitter:description"
      content="Real-time squat and bicep curl coaching in the browser with private edge pose estimation."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Prevent flash of wrong theme before first paint -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('gymcoach_theme');
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-app)] text-[var(--text-primary)] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
