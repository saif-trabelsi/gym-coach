<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Emerald Glow -->
  <circle cx="32" cy="32" r="20" fill="#10b981" fill-opacity="0.12" />

  <!-- Dumbbell Icon in Emerald -->
  <!-- Left Weight Plates -->
  <rect x="12" y="23" width="5" height="18" rx="2.5" fill="#10b981" />
  <rect x="18" y="20" width="4" height="24" rx="2" fill="#34d399" />

  <!-- Center Bar -->
  <rect x="22" y="29.5" width="20" height="5" rx="2" fill="#f8fafc" />

  <!-- Right Weight Plates -->
  <rect x="42" y="20" width="4" height="24" rx="2" fill="#34d399" />
  <rect x="47" y="23" width="5" height="18" rx="2.5" fill="#10b981" />

  <!-- Top Form Dot Accent -->
  <circle cx="32" cy="14" r="3" fill="#10b981" />
</svg>
